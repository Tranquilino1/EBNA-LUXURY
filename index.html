  <body>
    <div id="root"></div>
    <script>
      (function() {
        // Automatic recovery for stale Service Worker / ChunkLoadError on deployment updates
        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.indexOf('dynamically imported module') !== -1 || e.message.indexOf('Loading chunk') !== -1 || e.message.indexOf('Importing binding') !== -1)) {
            if (!sessionStorage.getItem('ebna_chunk_reload')) {
              sessionStorage.setItem('ebna_chunk_reload', '1');
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then(function(regs) {
                  regs.forEach(function(r) { r.unregister(); });
                });
              }
              window.location.reload(true);
            }
          }
        });
      })();
    </script>
